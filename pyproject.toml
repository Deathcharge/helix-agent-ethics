[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "samsarix-agent-ethics"
version = "0.1.0"
description = "A local, deterministic policy gate for autonomous agent actions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Andrew John Ward" },
    { name = "Samsarix LLC", email = "contact@samsarix.com" },
]
maintainers = [
    { name = "Samsarix LLC", email = "support@samsarix.com" },
]
keywords = ["ai-agents", "guardrails", "policy-as-code", "governance", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "mypy==1.19.1",
    "pytest==9.0.3",
    "pytest-cov==6.3.0",
    "ruff==0.15.12",
    "twine==6.2.0",
]

[project.scripts]
samsarix-ethics = "samsarix_ethics.cli:entrypoint"

[project.urls]
Homepage = "https://www.samsarix.com"
Repository = "https://github.com/Deathcharge/samsarix-agent-ethics"
Issues = "https://github.com/Deathcharge/samsarix-agent-ethics/issues"
Support = "https://github.com/Deathcharge/samsarix-agent-ethics/blob/main/SUPPORT.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
samsarix_ethics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=samsarix_ethics",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
source = ["samsarix_ethics"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["samsarix_ethics"]
mypy_path = "src"
