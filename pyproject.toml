[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-agent-ethics"
version = "0.1.0"
description = "A local, deterministic policy gate for autonomous agent actions"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Helix-Collective-BSL-1.1"
license-files = ["LICENSE", "LICENSE.PROPRIETARY"]
authors = [
    { name = "Helix Collective" },
    { name = "Andrew John Ward", email = "andrew@helixcollective.ai" },
]
keywords = ["ai-agents", "guardrails", "policy-as-code", "governance", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "mypy==1.19.1",
    "pytest==8.4.2",
    "pytest-cov==6.3.0",
    "ruff==0.15.12",
    "twine==6.2.0",
]

[project.scripts]
helix-ethics = "helix_ethics.cli:entrypoint"

[project.urls]
Repository = "https://github.com/Deathcharge/helix-agent-ethics"
Issues = "https://github.com/Deathcharge/helix-agent-ethics/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helix_ethics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=helix_ethics",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
source = ["helix_ethics"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["helix_ethics"]
mypy_path = "src"
