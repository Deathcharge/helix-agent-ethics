name: Bug report
description: Report a reproducible, non-sensitive product defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private policies, production inputs, personal data, or vulnerability details. Security reports belong in the process described by SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output from `samsarix-ethics --version` or the installed package version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Sanitized commands, policy/input fragments, or Python code that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed secrets, personal data, private policies, production inputs, and audit logs.
          required: true
