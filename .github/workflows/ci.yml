name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-dev.txt
            pyproject.toml
      - name: Install locked development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Test
        run: python -m pytest
      - name: Check formatting
        if: matrix.python-version == '3.11'
        run: python -m ruff format --check .
      - name: Lint
        if: matrix.python-version == '3.11'
        run: python -m ruff check .
      - name: Type check
        if: matrix.python-version == '3.11'
        run: python -m mypy
      - name: Build distributions
        if: matrix.python-version == '3.11'
        run: python -m build --no-isolation
      - name: Validate distributions
        if: matrix.python-version == '3.11'
        run: python -m twine check dist/*
      - name: Smoke-test installed wheel
        if: matrix.python-version == '3.11'
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv /tmp/samsarix-wheel
          /tmp/samsarix-wheel/bin/python -m pip install --no-deps "$wheel"
          /tmp/samsarix-wheel/bin/samsarix-ethics --version
          /tmp/samsarix-wheel/bin/samsarix-ethics validate examples/policies/safe-agent-actions.json
          /tmp/samsarix-wheel/bin/samsarix-ethics schema policy >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema policy-test >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema tool-context >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics test \
            --policy examples/policies/safe-agent-actions.json \
            examples/tests/safe-agent-actions.tests.json
          /tmp/samsarix-wheel/bin/samsarix-ethics test \
            --policy examples/policies/tool-call-baseline.json \
            examples/tests/tool-call-baseline.tests.json
          /tmp/samsarix-wheel/bin/python - <<'PY'
          from samsarix_ethics import ToolGate, load_policy

          gate = ToolGate(load_policy("examples/policies/tool-call-baseline.json"))
          result = gate.execute(
              "read_ticket",
              {"ticket_id": "T-100"},
              lambda arguments: f"executed {arguments['ticket_id']}",
              capabilities=["resource:read"],
          )
          assert result.value == "executed T-100"
          assert result.decision.allowed
          PY
          /tmp/samsarix-wheel/bin/python examples/tool_gate_demo.py
