name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-dev.txt
            pyproject.toml
      - name: Install locked development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Test
        run: python -m pytest
      - name: Check formatting
        if: matrix.python-version == '3.11'
        run: python -m ruff format --check .
      - name: Lint
        if: matrix.python-version == '3.11'
        run: python -m ruff check .
      - name: Type check
        if: matrix.python-version == '3.11'
        run: python -m mypy
      - name: Smoke-test source examples
        if: matrix.python-version == '3.11'
        run: |
          samsarix-ethics compose \
            --id tool-call-baseline \
            --version 1.0.0 \
            --description "Fail-closed baseline for read, destructive, external, and sensitive tool capabilities." \
            --policy examples/policies/organization-tool-guardrails.json \
            --policy examples/policies/support-agent-tool-permissions.json \
            --output /tmp/composed-tool-policy.json \
            --format json >/tmp/policy-composition.json
          python - <<'PY'
          import json
          from samsarix_ethics import (
              fingerprint_context_contract,
              fingerprint_policy,
              fingerprint_tool_catalog,
              load_context_contract,
              load_policy,
              load_policy_deployment,
              load_tool_catalog,
          )

          report = json.load(open("/tmp/policy-composition.json"))
          composed = load_policy("/tmp/composed-tool-policy.json")
          expected = load_policy("examples/policies/tool-call-baseline.json")
          assert composed == expected
          assert report["source_count"] == 2
          assert report["total_rules"] == 12
          assert report["policy_fingerprint"] == fingerprint_policy(expected)
          assert "conditions" not in json.dumps(report)
          coding_policy = load_policy("examples/policies/coding-agent-baseline.json")
          coding_contract = load_context_contract(
              "examples/contracts/coding-agent-tool-context.json"
          )
          coding_deployment = load_policy_deployment(
              "examples/deployment/coding-agent-baseline.deployment.json"
          )
          coding_catalog = load_tool_catalog("examples/catalogs/coding-agent-tools.json")
          assert coding_deployment.policy == coding_policy
          assert coding_deployment.context_contract == coding_contract
          assert coding_deployment.deployment_lock.policy.fingerprint == fingerprint_policy(
              coding_policy
          )
          assert coding_deployment.deployment_lock.context_contract is not None
          assert (
              coding_deployment.deployment_lock.context_contract.fingerprint
              == fingerprint_context_contract(coding_contract)
          )
          assert coding_catalog.tool_names == (
              "delete_file",
              "fetch_url",
              "read_file",
              "read_secret",
              "run_command",
              "send_message",
              "write_file",
          )
          assert fingerprint_tool_catalog(coding_catalog).startswith("v1:sha256:")
          PY
          samsarix-ethics test \
            --policy examples/policies/safe-agent-actions.json \
            examples/tests/safe-agent-actions.tests.json
          samsarix-ethics test \
            --policy /tmp/composed-tool-policy.json \
            examples/tests/tool-call-baseline.tests.json
          samsarix-ethics test \
            --policy examples/policies/coding-agent-baseline.json \
            --context-contract examples/contracts/coding-agent-tool-context.json \
            examples/tests/coding-agent-baseline.tests.json
          samsarix-ethics schema policy-comparison >/dev/null
          samsarix-ethics schema policy-composition >/dev/null
          samsarix-ethics schema policy-coverage >/dev/null
          samsarix-ethics schema policy-lint >/dev/null
          samsarix-ethics schema policy-shadow >/dev/null
          samsarix-ethics schema policy-runtime-status >/dev/null
          samsarix-ethics schema policy-deployment >/dev/null
          samsarix-ethics schema tool-catalog >/dev/null
          samsarix-ethics schema tool-gate-deployment >/dev/null
          samsarix-ethics schema tool-gate-deployment-envelope >/dev/null
          samsarix-ethics schema audit-chain-entry >/dev/null
          samsarix-ethics schema audit-chain-verification >/dev/null
          samsarix-ethics catalog examples/catalogs/coding-agent-tools.json >/dev/null
          samsarix-ethics gate-deployment create \
            --policy-deployment examples/deployment/coding-agent-baseline.deployment.json \
            --tool-catalog examples/catalogs/coding-agent-tools.json \
            --output /tmp/coding-agent.gate-deployment.json
          samsarix-ethics gate-deployment verify /tmp/coding-agent.gate-deployment.json
          python -c 'from pathlib import Path; Path("/tmp/deployment-auth.key").write_bytes(b"k" * 32)'
          auth_issued="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          auth_expires="$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)"
          samsarix-ethics gate-deployment authenticate \
            /tmp/coding-agent.gate-deployment.json \
            --key-file /tmp/deployment-auth.key \
            --key-id ci-key \
            --audience coding-agent:ci \
            --sequence 1 \
            --issued-at "$auth_issued" \
            --expires-at "$auth_expires" \
            --output /tmp/coding-agent.authenticated.json
          samsarix-ethics gate-deployment verify-authentication \
            /tmp/coding-agent.authenticated.json \
            --key-file /tmp/deployment-auth.key \
            --key-id ci-key \
            --audience coding-agent:ci \
            --minimum-sequence 1
          samsarix-ethics deployment verify \
            examples/deployment/tool-call-baseline.deployment.json
          samsarix-ethics deployment verify \
            examples/deployment/coding-agent-baseline.deployment.json
          python examples/audit_chain_demo.py >/dev/null
          for policy in examples/policies/*.json; do
            samsarix-ethics lint "$policy" --fail-on suggestion
          done
          samsarix-ethics coverage \
            --policy /tmp/composed-tool-policy.json \
            examples/tests/tool-call-baseline.tests.json \
            --threshold 100 \
            --format json >/tmp/policy-coverage.json
          samsarix-ethics coverage \
            --policy examples/policies/coding-agent-baseline.json \
            --context-contract examples/contracts/coding-agent-tool-context.json \
            examples/tests/coding-agent-baseline.tests.json \
            --threshold 100 >/dev/null
          python -c 'import json; value=json.load(open("/tmp/policy-coverage.json")); assert value["complete"] is True'
          set +e
          samsarix-ethics compare \
            --baseline examples/policies/safe-agent-actions.json \
            --candidate examples/policies/safe-agent-actions-candidate.json \
            examples/tests/safe-agent-actions.tests.json \
            --format json >/tmp/policy-impact.json
          comparison_status="$?"
          set -e
          test "$comparison_status" -eq 1
          python -c 'import json; value=json.load(open("/tmp/policy-impact.json")); assert value["authorization_changes"] == 1'
          samsarix-ethics shadow \
            --baseline examples/policies/safe-agent-actions.json \
            --candidate examples/policies/safe-agent-actions-candidate.json \
            --input examples/actions/read-restricted-resource.json \
            --format json >/tmp/policy-shadow.json
          python -c 'import json; value=json.load(open("/tmp/policy-shadow.json")); assert value["status"] == "changed"; assert value["authoritative"]["outcome"] == "allow"; assert value["candidate"]["outcome"] == "review"'
          python examples/tool_gate_demo.py
          python examples/policy_runtime_demo.py
          python examples/coding_agent_batch_demo.py
          python examples/tool_dispatcher_demo.py
          python examples/authenticated_deployment_demo.py
      - name: Build distributions
        if: matrix.python-version == '3.11'
        run: python -m build --no-isolation
      - name: Validate distributions
        if: matrix.python-version == '3.11'
        run: python -m twine check dist/*
      - name: Test extracted source distribution against built wheel
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          from tempfile import TemporaryDirectory

          sdists = list(Path("dist").glob("*.tar.gz"))
          wheels = list(Path("dist").glob("*.whl"))
          assert len(sdists) == len(wheels) == 1
          expected_tests = {
              path.as_posix(): path.read_bytes()
              for path in Path("tests").rglob("*.py")
          }
          assert "tests/conftest.py" in expected_tests
          environment = os.environ.copy()
          environment.pop("PYTHONPATH", None)
          environment.pop("PYTHONHOME", None)
          environment["PYTHONNOUSERSITE"] = "1"
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "--no-deps", "--force-reinstall",
               str(wheels[0].resolve())],
              check=True, env=environment, timeout=120,
          )
          with TemporaryDirectory(prefix="samsarix-sdist-") as directory:
              prefix = sdists[0].name.removesuffix(".tar.gz")
              with tarfile.open(sdists[0], "r:gz") as archive:
                  for name, expected in expected_tests.items():
                      member = archive.getmember(f"{prefix}/{name}")
                      assert member.isfile(), name
                      with archive.extractfile(member) as stream:
                          assert stream.read() == expected, name
                  archive.extractall(directory, filter="data")
              extracted = Path(directory) / prefix
              subprocess.run(
                  [sys.executable, "-c", "import samsarix_ethics, sys; "
                   "from pathlib import Path; "
                   "assert Path(samsarix_ethics.__file__).resolve().is_relative_to(sys.prefix)"],
                  cwd=extracted, check=True, env=environment, timeout=30,
              )
              subprocess.run(
                  [sys.executable, "-m", "pytest"],
                  cwd=extracted, check=True, env=environment, timeout=360,
              )
          PY
      - name: Smoke-test installed wheel
        if: matrix.python-version == '3.11'
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv /tmp/samsarix-wheel
          /tmp/samsarix-wheel/bin/python -m pip install --no-deps "$wheel"
          /tmp/samsarix-wheel/bin/samsarix-ethics --version
          /tmp/samsarix-wheel/bin/samsarix-ethics init /tmp/wheel-policy.json
          /tmp/samsarix-wheel/bin/samsarix-ethics validate /tmp/wheel-policy.json
          /tmp/samsarix-wheel/bin/samsarix-ethics schema policy >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema policy-test >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema policy-comparison >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema policy-composition >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema policy-coverage >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema policy-lint >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema policy-shadow >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema policy-runtime-status >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema policy-deployment >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema tool-catalog >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema tool-gate-deployment >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema tool-gate-deployment-envelope >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema tool-context >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema tool-approval >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema audit-record >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema audit-chain-entry >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics schema audit-chain-verification >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics deployment verify \
            examples/deployment/tool-call-baseline.deployment.json
          /tmp/samsarix-wheel/bin/samsarix-ethics check \
            --deployment examples/deployment/tool-call-baseline.deployment.json \
            --input examples/actions/tool-read-config.json >/dev/null
          /tmp/samsarix-wheel/bin/samsarix-ethics gate-deployment create \
            --policy-deployment examples/deployment/coding-agent-baseline.deployment.json \
            --tool-catalog examples/catalogs/coding-agent-tools.json \
            --output /tmp/wheel-coding-agent.gate-deployment.json
          /tmp/samsarix-wheel/bin/python -c 'from pathlib import Path; Path("/tmp/wheel-deployment-auth.key").write_bytes(b"k" * 32)'
          wheel_auth_issued="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wheel_auth_expires="$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)"
          /tmp/samsarix-wheel/bin/samsarix-ethics gate-deployment authenticate \
            /tmp/wheel-coding-agent.gate-deployment.json \
            --key-file /tmp/wheel-deployment-auth.key \
            --key-id wheel-ci-key \
            --audience coding-agent:wheel-ci \
            --sequence 1 \
            --issued-at "$wheel_auth_issued" \
            --expires-at "$wheel_auth_expires" \
            --output /tmp/wheel-coding-agent.authenticated.json
          /tmp/samsarix-wheel/bin/samsarix-ethics gate-deployment verify-authentication \
            /tmp/wheel-coding-agent.authenticated.json \
            --key-file /tmp/wheel-deployment-auth.key \
            --key-id wheel-ci-key \
            --audience coding-agent:wheel-ci \
            --minimum-sequence 1
          /tmp/samsarix-wheel/bin/python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from samsarix_ethics import (
              AUDIT_RECORD_VERSION,
              AuditRecord,
              HmacAuditChainSink,
              Policy,
              PolicyLintSeverity,
              PreparedToolCall,
              PolicyRuntime,
              PolicyShadowEvaluator,
              PolicyTestSuite,
              ToolCallDeniedError,
              ToolDispatcher,
              ToolGate,
              compare_policies,
              compose_policies,
              create_policy_deployment,
              fingerprint_policy,
              generate_audit_chain_key,
              lint_policy,
              load_tool_catalog,
              load_tool_gate_deployment,
              measure_policy_coverage,
              verify_audit_chain,
          )

          policy = Policy.from_dict({
              "schema_version": 1,
              "id": "wheel-smoke",
              "version": "1",
              "default_effect": "deny",
              "rules": [{
                  "id": "allow-read",
                  "effect": "allow",
                  "message": "Read capability is allowed.",
                  "conditions": [{
                      "field": "action.capabilities",
                      "operator": "contains",
                      "value": "resource:read",
                  }],
              }],
          })
          records: list[AuditRecord] = []
          candidate = Policy.from_dict({
              "schema_version": 1,
              "id": "wheel-smoke-candidate",
              "version": "2",
              "default_effect": "deny",
              "rules": [],
          })
          suite = PolicyTestSuite.from_dict({
              "schema_version": 1,
              "cases": [{
                  "name": "read impact",
                  "input": {"action": {"capabilities": ["resource:read"]}},
                  "expected_outcome": "allow",
              }],
          })
          lint_report = lint_policy(policy, fail_on=PolicyLintSeverity.SUGGESTION)
          assert lint_report.findings == ()
          assert lint_report.passed is True
          coverage = measure_policy_coverage(policy, suite, threshold=100)
          assert coverage.complete is True
          assert coverage.threshold_met is True
          comparison = compare_policies(policy, candidate, suite)
          assert comparison.authorization_changes == 1
          assert comparison.identical is False
          shadow = PolicyShadowEvaluator(policy, candidate).evaluate(
              {"action": {"capabilities": ["resource:read"]}}
          )
          assert shadow.authoritative_decision.allowed is True
          assert shadow.candidate_decision is not None
          assert shadow.candidate_decision.outcome.value == "deny"
          assert shadow.authorization_changed is True
          assert "action" not in json.dumps(shadow.to_dict())
          composition = compose_policies(
              [policy, candidate],
              policy_id="wheel-layered",
              policy_version="1",
          )
          assert composition.policy.rules == policy.rules
          assert composition.to_dict()["source_count"] == 2
          gate = ToolGate(policy, audit_sink=records.append)
          read_ticket = gate.bind("read_ticket", capabilities=["resource:read"])
          result = read_ticket.execute(
              {"ticket_id": "T-100"},
              lambda arguments: f"executed {arguments['ticket_id']}",
          )
          assert result.value == "executed T-100"
          assert result.decision.allowed
          assert result.decision.policy_fingerprint == fingerprint_policy(policy)
          assert read_ticket.policy_fingerprint == gate.policy_fingerprint
          assert read_ticket.capabilities == ("resource:read",)
          assert len(records) == 1
          assert records[0].audit_record_version == AUDIT_RECORD_VERSION == 1
          assert records[0].policy_fingerprint == result.decision.policy_fingerprint
          with TemporaryDirectory() as directory:
              chain_path = Path(directory) / "wheel-audit-chain.jsonl"
              chain_key = generate_audit_chain_key()
              chain_sink = HmacAuditChainSink(
                  chain_path,
                  chain_key,
                  stream_id="wheel-smoke",
              )
              chain_sink(records[0])
              assert chain_sink.head_mac is not None
              chain = verify_audit_chain(
                  chain_path,
                  chain_key,
                  expected_head=chain_sink.head_mac,
                  expected_stream_id="wheel-smoke",
              )
              assert chain.entry_count == 1
          prepared = read_ticket.prepare({"ticket_id": "T-101"})
          assert isinstance(prepared, PreparedToolCall)
          assert prepared.arguments == {"ticket_id": "T-101"}
          assert gate.enforce_many([prepared])[0].allowed is True
          coding_catalog = load_tool_catalog("examples/catalogs/coding-agent-tools.json")
          registered_tools = {
              "delete_file",
              "fetch_url",
              "read_file",
              "read_secret",
              "run_command",
              "send_message",
              "write_file",
          }
          catalog_bindings = gate.bind_catalog(
              coding_catalog,
              registered_tools=registered_tools,
          )
          assert catalog_bindings.catalog_fingerprint.startswith("v1:sha256:")
          assert catalog_bindings["run_command"].capabilities == (
              "process:execute",
              "risk:elevated",
          )
          gate_deployment = load_tool_gate_deployment(
              "/tmp/wheel-coding-agent.gate-deployment.json"
          )
          deployed_bindings = ToolGate.bind_deployment(
              gate_deployment,
              registered_tools=registered_tools,
          )
          assert deployed_bindings.catalog_fingerprint == (
              gate_deployment.tool_catalog_fingerprint
          )
          deployed_dispatcher = ToolDispatcher.bind_deployment(
              gate_deployment,
              registered_tools={
                  name: (lambda **arguments: arguments)
                  for name in registered_tools
              },
          )
          dispatched = deployed_dispatcher.execute(
              "read_file",
              {"path": "README.md"},
              actor={"id": "wheel-smoke"},
              context={"workspace_contained": True},
          )
          assert dispatched.value == {"path": "README.md"}
          assert dispatched.decision.allowed is True
          delete_ticket = gate.bind("delete_ticket", capabilities=["destructive"])
          blocked_batch = [prepared, delete_ticket.prepare({"ticket_id": "T-101"})]
          try:
              gate.enforce_many(blocked_batch)
          except ToolCallDeniedError as exc:
              assert exc.blocking_index == 1
              assert exc.decision is exc.decisions[1]
              assert [decision.outcome.value for decision in exc.decisions] == ["allow", "deny"]
          else:
              raise AssertionError("the destructive batch must be denied")
          runtime = PolicyRuntime.from_deployment(create_policy_deployment(policy))
          runtime_gate = ToolGate(runtime).bind("read_ticket", capabilities=["resource:read"])
          assert runtime_gate.evaluate({"ticket_id": "T-200"}).allowed is True
          candidate_status = runtime.activate_deployment(
              create_policy_deployment(candidate), expected_generation=1
          )
          assert candidate_status.generation == 2
          assert runtime_gate.evaluate({"ticket_id": "T-200"}).outcome.value == "deny"
          PY
      - name: Upload verified distributions
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  openai-agents-contract:
    name: OpenAI Agents SDK 0.18.3 contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-openai-agents.lock
            pyproject.toml
      - name: Install locked development and SDK contract dependencies
        run: |
          python -m pip install --require-hashes \
            -r requirements-dev.lock \
            -r requirements-openai-agents.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Test exact OpenAI Agents SDK contract
        run: python -m pytest --no-cov integration_tests/test_openai_agents_sdk.py
      - name: Smoke-test the OpenAI Agents example
        run: python examples/openai_agents_guardrail_demo.py

  langchain-contract:
    name: LangChain 1.3.14 contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-langchain.lock
            pyproject.toml
      - name: Install locked development and LangChain contract dependencies
        run: |
          python -m pip install --require-hashes \
            -r requirements-dev.lock \
            -r requirements-langchain.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Test exact LangChain agent contract
        run: python -m pytest --no-cov integration_tests/test_langchain_sdk.py
      - name: Smoke-test the LangChain example
        run: python examples/langchain_policy_middleware_demo.py

  pydantic-ai-contract:
    name: Pydantic AI 2.22.0 contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-pydantic-ai.lock
            pyproject.toml
      - name: Install locked development and Pydantic AI contract dependencies
        run: |
          python -m pip install --require-hashes \
            -r requirements-dev.lock \
            -r requirements-pydantic-ai.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Test exact Pydantic AI agent contract
        run: python -m pytest --no-cov integration_tests/test_pydantic_ai_sdk.py
      - name: Smoke-test the Pydantic AI example
        run: python examples/pydantic_ai_policy_toolset_demo.py

  mcp-contract:
    name: MCP Python SDK 1.28.1 contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-mcp.lock
            pyproject.toml
      - name: Install locked development and MCP contract dependencies
        run: |
          python -m pip install --require-hashes \
            -r requirements-dev.lock \
            -r requirements-mcp.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Test exact MCP server contract
        run: python -m pytest --no-cov integration_tests/test_mcp_sdk.py
      - name: Smoke-test the MCP server example
        run: python examples/mcp_server_policy_demo.py

  mcp-client-contract:
    name: MCP Python SDK 2.1.1 client contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-mcp-client.lock
            pyproject.toml
      - name: Install locked development and MCP v2 client dependencies
        run: |
          python -m pip install --require-hashes \
            -r requirements-dev.lock \
            -r requirements-mcp-client.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Test exact MCP client contract
        run: >-
          python -m pytest --no-cov
          integration_tests/test_mcp_client_sdk.py
          integration_tests/test_mcp_client_http.py
          integration_tests/test_mcp_http_transport.py
          integration_tests/test_mcp_client_oauth.py
          integration_tests/test_mcp_client_refresh.py
      - name: Smoke-test the MCP client example
        run: python examples/mcp_client_policy_demo.py

  deployment-process-contract:
    name: Deployment process recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked core development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Test actual process death, publication races, and restart
        run: python -m pytest --no-cov integration_tests/test_deployment_process.py
      - name: Demonstrate fresh-process emergency-policy recovery
        run: python examples/policy_restart_demo.py
      - name: Measure bounded local workloads (latencies are informational)
        run: >-
          python -m benchmarks.policy_gate run --iterations 10 --repeats 3 --warmup 2
          --max-seconds 120 --output benchmark-results.json
      - name: Verify compatible report comparison
        run: >-
          python -m benchmarks.policy_gate compare benchmark-results.json benchmark-results.json
          --max-regression-percent 0
      - name: Retain machine-readable performance evidence
        if: ${{ always() && hashFiles('benchmark-results.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy-benchmarks-${{ matrix.os }}-${{ github.sha }}
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 14

  opentelemetry-contract:
    name: OpenTelemetry 1.44.0 contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-opentelemetry.lock
            pyproject.toml
      - name: Install locked development and OpenTelemetry contract dependencies
        run: |
          python -m pip install --require-hashes \
            -r requirements-dev.lock \
            -r requirements-opentelemetry.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Test exact OpenTelemetry API and SDK contract
        run: python -m pytest --no-cov integration_tests/test_opentelemetry_sdk.py
      - name: Smoke-test the OpenTelemetry example
        run: python examples/opentelemetry_decision_event_demo.py

  attest:
    name: Attest distributions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        test,
        openai-agents-contract,
        langchain-contract,
        pydantic-ai-contract,
        mcp-contract,
        mcp-client-contract,
        deployment-process-contract,
        opentelemetry-contract,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions-${{ github.sha }}
          path: dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
